[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-video-service"
version = "0.3.0"
description = "A live video look for agents, one provider on the card."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "aiortc==1.16.0",
    "fastapi==0.163.1",
    "overnightworks-logline @ git+https://github.com/overnightworks/logline@v0.8.0",
    "overnightworks-video-client",
    "overnightworks-video-provider-contract",
    "overnightworks-webauth @ git+https://github.com/overnightworks/webauth@v0.40.1",
    "pillow==13.0.0",
    "pydantic-settings==2.16.3",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.scripts]
video-service = "video_service.__main__:main"

[dependency-groups]
dev = [
    "cryptography==50.0.2",
    "httpx2==2.16.0",
    "overnightworks-video-provider-fake",
    "playwright==1.65.2",
    "pyjwt[crypto]==2.15.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.5",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/video_service"]

[tool.uv.workspace]
members = ["packages/client", "providers/*"]
# Its model stack (torch, xfuser, transformers at the pins upstream tolerates) keeps a lock of its own.
exclude = ["providers/flashhead-lite"]

[tool.uv]
# --no-build installs every other package as a wheel; a named package overrides it,
# and these are built from this checkout or from the logline tag the lock pins.
no-binary-package = [
    "overnightworks-logline",
    "overnightworks-video-client",
    "overnightworks-video-provider-contract",
    "overnightworks-video-provider-fake",
    "overnightworks-video-service",
    "overnightworks-webauth",
]

[tool.uv.sources]
overnightworks-video-client = { workspace = true }
overnightworks-video-provider-contract = { workspace = true }
overnightworks-video-provider-fake = { workspace = true }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -m 'not browser and not flashhead_lite and not image'"
markers = [
    "browser: drives Chromium against the built browser package",
    "flashhead_lite: starts the real FlashHead lite worker from the provider's own environment",
    "image: drives the built image, which VIDEO_IMAGE names",
]
pythonpath = [".", "scripts", "tests", "providers/flashhead-lite/src"]
testpaths = [
    "tests",
    "packages/client/tests",
    "providers/fake/tests",
    "providers/provider-contract/tests",
]

[tool.coverage.run]
branch = true
patch = ["subprocess", "_exit"]
include = ["src/*", "packages/*/src/*", "providers/*/src/*", "scripts/*"]
# The calls that need a card cannot run on a CI runner; the card proof drives them.
omit = ["providers/flashhead-lite/src/video_provider_flashhead_lite/card.py"]

[tool.ruff]
target-version = "py314"
# Upstream's tree is bound unchanged and is no code of ours.
extend-exclude = ["providers/flashhead-lite/soulx-flashhead"]
src = [
    ".",
    "scripts",
    "src",
    "packages/client/src",
    "tests",
    "packages/client/tests",
    "providers/fake/tests",
    "providers/flashhead-lite/tests",
    "providers/provider-contract/tests",
]
# The gate's layout rules forbid package markers in these directories.
namespace-packages = [
    "scripts",
    "tests/scripts",
    "tests/support",
    "packages/client/tests/support",
    "providers/flashhead-lite/tests/support",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
]

[tool.ruff.lint.flake8-type-checking]
# FastAPI evaluates the route handlers' annotations when it builds the app.
runtime-evaluated-decorators = ["fastapi.FastAPI.get"]
# Pydantic resolves the field annotations of its models when the class is built.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Asserts are the tests' checks; a test function's name is its documentation.
"tests/**" = ["S101", "D103"]
"packages/client/tests/**" = ["S101", "D103"]
"providers/fake/tests/**" = ["S101", "D103"]
"providers/flashhead-lite/tests/**" = ["S101", "D103"]
"providers/provider-contract/tests/**" = ["S101", "D103"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
