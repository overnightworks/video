version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Our libraries come from Git or this repository; a PyPI package of the same name is not ours
      - dependency-name: "overnightworks-*"
    groups:
      uv-video:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /providers/flashhead-lite
    schedule:
      interval: weekly
    ignore:
      # Our libraries come from Git or this repository; a PyPI package of the same name is not ours
      - dependency-name: "overnightworks-*"
    groups:
      uv-flashhead-lite:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /packages/browser
    schedule:
      interval: weekly
