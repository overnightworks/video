version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The base image's Python moves with .python-version and the provider's requires-python, which its locked wheels hold below 3.15
      - dependency-name: "python"
        versions: [">=3.15"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Our libraries come from Git or this repository; a PyPI package of the same name is not ours
      - dependency-name: "overnightworks-*"
    groups:
      uv-video:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /providers/flashhead-lite
    schedule:
      interval: weekly
    ignore:
      # Our libraries come from Git or this repository; a PyPI package of the same name is not ours
      - dependency-name: "overnightworks-*"
      # From 5.16 on, upstream's wav2vec2 encoder ignores output_hidden_states and its audio preprocessing raises
      - dependency-name: "transformers"
        versions: [">=5.16"]
    groups:
      uv-flashhead-lite:
        update-types: [minor, patch]
        # The model stack stays single PRs so each lands with the encoder proof
        exclude-patterns:
          - "diffusers"
          - "einops"
          - "loguru"
          - "mediapipe"
          - "numpy"
          - "nvidia-*"
          - "opencv-python-headless"
          - "pyloudnorm"
          - "pyyaml"
          - "safetensors"
          - "torch"
          - "torchvision"
          - "transformers"
          - "xfuser"
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/browser
    schedule:
      interval: weekly
