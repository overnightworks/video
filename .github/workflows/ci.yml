name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A pull request collapses onto its newest push, but every push to main keeps a
# group of its own so no landing is ever cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  video:
    name: "Video: lint, tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --no-build

      - name: Check source
        run: uv run --locked --no-build ruff check

      - name: Check formatting
        run: uv run --locked --no-build ruff format --check

      - name: Test
        env:
          COVERAGE_DEBUG: pid,process,dataio
          COVERAGE_DEBUG_FILE: ${{ runner.temp }}/coverage-debug.log
        run: uv run --locked --no-build pytest -n auto --cov --cov-report=xml:coverage-root.xml

      - name: Upload the coverage debug log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-debug-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-debug.log
          if-no-files-found: error

      # A provider's environment may be older than the service's, so the contract's
      # own tests run on the oldest Python it supports, in an environment apart from
      # the workspace whose requirements are locked with their hashes.
      - name: Test the provider contract on Python 3.10
        env:
          PYTHONPATH: providers/provider-contract/src
        run: |
          # the hashed requirements carry the pytest and pytest-randomly the workspace lock
          # pins, so a bump of the lock that leaves them behind fails here
          locked=$(uv export --locked --no-build --no-hashes | grep -E '^pytest(-randomly)?==')
          while read -r pin; do grep -q "^$pin " providers/provider-contract/requirements-test.txt; done <<< "$locked"
          uv venv --python 3.10 "$RUNNER_TEMP/contract-env"
          uv pip install --python "$RUNNER_TEMP/contract-env" --no-build --require-hashes -r providers/provider-contract/requirements-test.txt
          # pytest-workers: a few dozen tests in under a second, and xdist is not installed there
          "$RUNNER_TEMP/contract-env/bin/python" -m pytest -p no:cacheprovider -c providers/provider-contract/pyproject.toml providers/provider-contract/tests

      - name: Upload the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-root
          path: coverage-root.xml
          if-no-files-found: error
