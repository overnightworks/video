name: Release

# The app's release: one dated version, YYYY.MM.DD.N, the image built on the larger runner,
# pushed private and attested, proven by its test on the pushed digest, then the git tag
# `v<version>`. The client distribution and the browser package release at X.Y.Z in
# `release-distributions.yml`. Every quality call below is pinned at a quality release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, YYYY.MM.DD.N"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    uses: overnightworks/quality/.github/workflows/release-gate.yml@1d66f90569946cf182634a3372e1e183cec8353b # v0.22.0
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    with:
      version: ${{ inputs.version }}
      form: YYYY.MM.DD.N

  # The image is larger than the standard runner's disk holds, so it builds on the paid
  # larger runner `speech-gpu-build`; only the image jobs use it. It is the release's build
  # and waits only for the gate.
  image:
    name: Image
    needs: gate
    uses: overnightworks/quality/.github/workflows/image.yml@1d66f90569946cf182634a3372e1e183cec8353b # v0.22.0
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    with:
      version: ${{ inputs.version }}
      push: true
      submodules: true
      reproducible-layers: true
      runner: speech-gpu-build

  # quality's image workflow has no test step: the pushed digest is pulled and tested
  # here, and the tag waits for it, so a failed test leaves a private version untagged.
  image-test:
    name: Image test
    needs: image
    uses: $/.github/workflows/image-test.yml
    permissions:
      contents: read
      packages: read
    with:
      runner: speech-gpu-build
      image: ${{ needs.image.outputs.ref }}

  tag:
    name: Tag
    needs:
      - gate
      - image-test
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@1d66f90569946cf182634a3372e1e183cec8353b # v0.22.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
