name: image test

# The image does not fit a standard runner's disk, so the runner arrives as an input; the
# fleet's workflow lint knows only GitHub's hosted labels, and a literal `runs-on` of the
# larger runner's label is refused. Two cases, by the inputs: `image` names a pushed
# image, which is pulled by digest; without it, the image is built from the checked-out
# commit without a push.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner the test runs on, a larger one, as the image is pulled or built
        type: string
        required: true
      image:
        description: The pushed image to pull, by digest; empty to build instead
        type: string
        default: ''

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      VIDEO_IMAGE: ${{ inputs.image || 'video-image-under-test' }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # the test reads upstream's licence text, and a build packs upstream's tree
          submodules: true

      - name: Log in to the registry
        if: inputs.image != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the pushed image
        if: inputs.image != ''
        run: docker pull "$VIDEO_IMAGE"

      - name: Build the image without a push
        if: inputs.image == ''
        run: docker build --tag "$VIDEO_IMAGE" .

      - name: Report the image size
        run: |
          bytes=$(docker image inspect --format '{{.Size}}' "$VIDEO_IMAGE")
          echo "The image is ${bytes} bytes unpacked." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          version: "0.10.9"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --no-build

      - name: Run the image test
        # pytest-workers: one image, and the cases start containers one after the other
        # pytest-random: the cases run one after another against one real image
        run: uv run --locked --no-build pytest -q -m image tests/e2e/test_image.py
