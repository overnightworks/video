sonar.organization=overnightworks
sonar.projectKey=overnightworks_video
sonar.projectName=video
sonar.sources=src,packages/client/src,providers/provider-contract/src,providers/fake/src,packages/browser/src
sonar.tests=tests,packages/client/tests,providers/fake/tests
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage-root.xml
sonar.javascript.lcov.reportPaths=coverage-browser.lcov
# The browser package's scripts run in CI jobs that fail on any defect (the pack and install
# proof, the coverage conversion), so no coverage report measures them.
sonar.coverage.exclusions=packages/browser/scripts/**
