[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "overnightworks-video-provider-flashhead-lite"
version = "0.3.0"
description = "The FlashHead lite provider: the port's calls turned into slice renders, bound to the unchanged upstream model."
license = "MIT AND Apache-2.0"
license-files = ["soulx-flashhead/LICENSE"]
requires-python = ">=3.14,<3.15"
# Upstream's list is mostly unpinned and names packages this path never imports, so
# the lock owns the pins. Two depart from upstream's, on purpose.
dependencies = [
    "diffusers==0.43.0",
    "einops==0.8.2",
    "loguru==0.8.0",
    # Upstream pins 0.10.9, which needs protobuf below 5 and leaves advisories no
    # relock closes; 1.2.3 needs no protobuf. It has no `mp.solutions`, so upstream's
    # optional face crop falls back to the uncropped image.
    "mediapipe==1.2.3",
    "numpy==2.5.5",
    "opencv-python-headless==5.1.0.95",
    "overnightworks-video-provider-contract",
    "pyloudnorm==0.2.0",
    "pyyaml==6.0.3",
    "safetensors==0.8.0",
    "soxr==1.0.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    # Upstream pins 4.57.3, whose line carries advisories. 5.16 on ignores
    # `output_hidden_states` in the wav2vec2 encoder and upstream's audio
    # preprocessing raises, so 5.15.1 is the last release that serves upstream.
    "transformers==5.15.1",
    # 0.4.3, upstream's floor, calls torch.cuda.get_device_name at import and fails
    # without a card; 0.4.5 returns early and offers the same imports.
    "xfuser==0.4.5",
]

[tool.uv.sources]
overnightworks-video-provider-contract = { path = "../provider-contract", editable = true }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# mediapipe and xfuser list the GUI OpenCV builds, which write the same cv2 package as
# the headless build upstream needs and link X and GL libraries a headless host lacks;
# nothing here opens a window, so the override drops them.
override-dependencies = [
    "opencv-contrib-python ; sys_platform == 'never'",
    "opencv-python ; sys_platform == 'never'",
]
# --no-build installs every other package as a wheel; a named package overrides it,
# and these are built from this checkout.
no-binary-package = [
    "overnightworks-video-provider-contract",
    "overnightworks-video-provider-flashhead-lite",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/video_provider_flashhead_lite"]

# Upstream has no pyproject, so the submodule's `flash_head` tree is packed into this
# wheel; an install from a checkout without the submodule fails here, loudly.
[tool.hatch.build.targets.wheel.force-include]
"soulx-flashhead/flash_head" = "flash_head"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
pythonpath = ["tests/support"]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py314"
